[project]
name = "bcos-rl-thesis"
version = "1.0.0"
description = "Interpretable Reinforcement Learning via B-cos Networks and Action-Conditioned Attribution Guidance."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3,<3.0",
    "torchvision>=0.18",
    "tensorboard>=2.10",
    "stable-baselines3>=2.3,<3.0",
    "bcos>=0.1.3",
    "numpy<2",
    "captum>=0.8.0",
    "wandb>=0.25.1",
    "opencv-python>=4.11.0.86",
    "minigrid>=3.0.0",
    "imageio>=2.37.3",
    "swig>=4.4.1",
    "gymnasium[box2d]>=1.2.3",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
